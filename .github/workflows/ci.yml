name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@1.25.15 lint openapi/incidents-api.yaml

  services:
    name: Python services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Security scan (bandit)
        run: bandit -q -r src -s B310  # B310: urllib to configured HTTPS endpoints is intended
      - run: pytest -q

  frontend:
    name: React app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build   # regenerates API types from the contract, type-checks, bundles
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  infra:
    name: CDK synth and checks
    runs-on: ubuntu-latest
    needs: [services, frontend]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - run: npx cdk synth -q   # fails on guardrail errors, e.g. IAM "*" actions
      - name: IaC security scan (checkov)
        run: |
          pip install checkov==3.2.334
          checkov -d cdk.out --framework cloudformation --quiet --compact --soft-fail
      - uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: infra/cdk.out

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [infra, contract]
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    environment: dev
    permissions:
      contents: read
      id-token: write   # GitHub OIDC -> AWS IAM role; no long-lived AWS keys in GitHub
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      - run: npm ci
      - run: npx cdk deploy --require-approval never -c azs=1
