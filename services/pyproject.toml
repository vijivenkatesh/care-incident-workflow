[project]
name = "care-incident-services"
version = "1.0.0"
requires-python = ">=3.12"
# Runtime code uses only the standard library plus boto3/botocore,
# which the AWS Lambda Python runtime already provides.

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "bandit>=1.7", "boto3>=1.34"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
